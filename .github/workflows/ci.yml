name: CI

on:
  push:
    branches: [main, master, "claude/*", develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PHP Lint & Unit Tests ────────────────────────────────────────────────
  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.9
        ports: ["7700:7700"]
        env:
          MEILI_MASTER_KEY: changeme_master_key
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, gd, sodium
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for Meilisearch
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:7700/health && break
            sleep 2
          done

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit --coverage-clover coverage/clover.xml
        env:
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_API_KEY: changeme_master_key

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration
        env:
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_API_KEY: changeme_master_key

      - name: Upload coverage (PHP 8.2 only)
        if: matrix.php == '8.2' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: coverage/clover.xml
          fail_ci_if_error: false

  # ── PHP Code Style ────────────────────────────────────────────────────────
  phpcs:
    name: "PHP Code Sniffer (WordPress)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2, cs2pr

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        run: |
          vendor/bin/phpcs --standard=WordPress \
            --extensions=php \
            --ignore=vendor/,tests/ \
            src/ meiliwoo-search.php | cs2pr
        continue-on-error: true

  # ── JavaScript Lint ────────────────────────────────────────────────────────
  js-lint:
    name: "JavaScript Lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci
        continue-on-error: true

      - name: Run ESLint
        run: npm run lint:js --if-present
        continue-on-error: true

  # ── Plugin ZIP build ─────────────────────────────────────────────────────
  build:
    name: "Build Plugin ZIP"
    runs-on: ubuntu-latest
    needs: phpunit
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Install Composer (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -r dist/meiliwoo-search.zip . \
            --exclude "*.git*" \
            --exclude "tests/*" \
            --exclude "node_modules/*" \
            --exclude "coverage/*" \
            --exclude "*.env" \
            --exclude "phpunit.xml" \
            --exclude "*.github/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meiliwoo-search-plugin
          path: dist/meiliwoo-search.zip
          retention-days: 14
